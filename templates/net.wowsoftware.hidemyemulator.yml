id: hidemyemulator-premium
info:
  name: HideMyEmulator Premium Unlock
  author: reverser.id
  severity: info
  tags:
  - premium
  - license
  - unlock
  - xposed
  description: Forces lifetime-premium license state for net.wowsoftware.hidemyemulator (1.3 and 1.4). Unlocks all protection toggles + Apply, removes the paywall, adds patched-by credit + launch toast.
  reference:
  - https://reverser.id
target:
  package: net.wowsoftware.hidemyemulator
variants:
- match:
    version_name: ^1\.4
  patches:
  - name: d9/b mapper -> premium
    file: smali/d9/b.smali
    find: \.method public static r\(Ljava/lang/String;Ljava/lang/String;Ljava/time/ZoneId;\)Lnb/s;.*?\.end method
    replace: ".method public static r(Ljava/lang/String;Ljava/lang/String;Ljava/time/ZoneId;)Lnb/s;\n    .locals 1\n    new-instance p0, Lnb/p;\n    const/4 v0, 0x0\n    invoke-direct {p0, v0, v0}, Lnb/p;-><init>(Ljava/lang/Long;Ljava/lang/String;)V\n    return-object p0\n.end method"
    count: 1
  - name: ec/q flow -> premium
    file: smali/ec/q.smali
    find: (:cond_0\n)    sget-object p1, Lnb/r;->a:Lnb/r;
    replace: "$1    new-instance p1, Lnb/p;\n    const/4 v1, 0x0\n    invoke-direct {p1, v1, v0}, Lnb/p;-><init>(Ljava/lang/Long;Ljava/lang/String;)V"
    count: 1
  - name: ModuleStatus -> active
    file: smali/net/wowsoftware/hidemyemulator/core/ModuleStatus.smali
    find: (\.method public final isModuleActive\(\)Z\n    \.locals 1\n\n    \.line 1\n)    const/4 v0, 0x0
    replace: $1    const/4 v0, 0x1
    count: 1
  - name: hc/r unlock -> true
    file: smali/hc/r.smali
    find: '    if-ne p1, v0, :cond_4'
    replace: '    const/4 p1, 0x1

      '
    count: 1
  - name: hc/s a-flag -> true
    file: smali/hc/s.smali
    find: '    iget-boolean v2, v0, Lhc/s;->i:Z'
    replace: '    const/4 v2, 0x1'
    count: 1
  - name: hc/s i-flag -> true
    file: smali/hc/s.smali
    find: '    iget-boolean v10, v0, Lhc/s;->m:Z'
    replace: '    const/4 v10, 0x1'
    count: 1
  - name: hc/s license -> premium
    file: smali/hc/s.smali
    find: (:cond_0\n)    const-wide v11, -0x14040da4ffffffd6L
    replace: "$1    new-instance v1, Lnb/p;\n    const/4 v7, 0x0\n    invoke-direct {v1, v7, v7}, Lnb/p;-><init>(Ljava/lang/Long;Ljava/lang/String;)V\n    const-wide v11, -0x14040da4ffffffd6L"
    count: 1
  - name: hc/t i-flag -> true
    file: smali/hc/t.smali
    find: '    const/4 v15, 0x0'
    replace: '    const/4 v15, 0x1'
    count: 1
  - name: hc/t a-flag -> true
    file: smali/hc/t.smali
    find: '    move v7, v3'
    replace: '    const/4 v7, 0x1'
    count: 1
  - name: hc/t license -> premium
    file: smali/hc/t.smali
    find: '    sget-object v8, Lnb/q;->a:Lnb/q;'
    replace: "    new-instance v8, Lnb/p;\n    const/4 v9, 0x0\n    invoke-direct {v8, v9, v9}, Lnb/p;-><init>(Ljava/lang/Long;Ljava/lang/String;)V"
    count: 1
  - name: values status -> Premium
    file: res/values/strings.xml
    find: <string name=\"app_info_not_activated\">.*?</string>
    replace: <string name="app_info_not_activated">Premium</string>
    count: 1
  - name: values developer credit
    file: res/values/strings.xml
    find: <string name=\"app_info_developer\">.*?</string>
    replace: <string name="app_info_developer">Patched by reverser.id</string>
    count: 1
  - name: values about credit
    file: res/values/strings.xml
    find: (<string name=\"app_info_about\">)(.*?)(</string>)
    replace: $1$2 · patched by reverser.id$3
    count: 1
  - name: values-in status -> Premium
    file: res/values-in/strings.xml
    find: <string name=\"app_info_not_activated\">.*?</string>
    replace: <string name="app_info_not_activated">Premium</string>
    count: 1
  - name: values-in developer credit
    file: res/values-in/strings.xml
    find: <string name=\"app_info_developer\">.*?</string>
    replace: <string name="app_info_developer">Patched by reverser.id</string>
    count: 1
  - name: values-in about credit
    file: res/values-in/strings.xml
    find: (<string name=\"app_info_about\">)(.*?)(</string>)
    replace: $1$2 · patched by reverser.id$3
    count: 1
  - name: launch toast
    file: smali/net/wowsoftware/hidemyemulator/MainActivity.smali
    find: (\.method public final onCreate\(Landroid/os/Bundle;\)V\n    \.locals 9\n\n    \.line 1\n)
    replace: "$1    const-string v9, \"Patched by reverser.id | https://reverser.id\"\n    const/4 v10, 0x1\n    invoke-static {p0, v9, v10}, Landroid/widget/Toast;->makeText(Landroid/content/Context;Ljava/lang/CharSequence;I)Landroid/widget/Toast;\n    move-result-object v9\n    invoke-virtual {v9}, Landroid/widget/Toast;->show()V\n"
    count: 1
    must_contain:
    - reverser.id
  - name: toast registers
    file: smali/net/wowsoftware/hidemyemulator/MainActivity.smali
    find: (\.method public final onCreate\(Landroid/os/Bundle;\)V\n)    \.locals 9
    replace: $1    .locals 11
    count: 1
- match:
    version_name: ^1\.3
  patches:
  - name: o9/a mapper -> premium
    file: smali/o9/a.smali
    find: \.method public static a\(Lz9/h;J\)Lo9/k;.*?\.end method
    replace: ".method public static a(Lz9/h;J)Lo9/k;\n    .locals 1\n    new-instance p0, Lo9/h;\n    const/4 v0, 0x0\n    invoke-direct {p0, v0, v0}, Lo9/h;-><init>(Ljava/lang/String;Ljava/lang/Long;)V\n    return-object p0\n.end method"
    count: 1
  - name: o9/c exception fallback -> premium
    file: smali/o9/c.smali
    find: (invoke-static \{v0, v1, p1\}, Landroid/util/Log;->w\(Ljava/lang/String;Ljava/lang/String;Ljava/lang/Throwable;\)I\n.*?)\s*sget-object p1, Lo9/j;->a:Lo9/j;
    replace: "$1\n    new-instance p1, Lo9/h;\n    const/4 v0, 0x0\n    invoke-direct {p1, v0, v0}, Lo9/h;-><init>(Ljava/lang/String;Ljava/lang/Long;)V"
    count: 1
  - name: ba/u combine -> premium
    file: smali/ba/u.smali
    find: (:cond_5\n    check-cast v2, Lba/v;).*?invoke-direct \{v3, v0, v1, p1, v2\}, Lba/s;-><init>\(Lo9/k;Ljava/lang/Long;ZZ\)V
    replace: ":cond_5\n    check-cast v2, Lba/v;\n\n    .line 121\n    .line 122\n    iget-boolean p1, v2, Lba/v;->c:Z\n\n    .line 123\n    new-instance v0, Lo9/h;\n\n    .line 124\n    const/4 v1, 0x0\n\n    invoke-direct {v0, v1, v1}, Lo9/h;-><init>(Ljava/lang/String;Ljava/lang/Long;)V\n\n    const/4 v1, 0x0\n\n    const/4 v2, 0x1\n\n    .line 125\n    .line 126\n    new-instance v3, Lba/s;\n\n    .line 127\n    .line 128\n    invoke-direct {v3, v0, v1, p1, v2}, Lba/s;-><init>(Lo9/k;Ljava/lang/Long;ZZ)V"
    count: 1
  - name: ba/v initial -> premium
    file: smali/ba/v.smali
    find: '    const/16 v3, 0xb.*?    :goto_0'
    replace: "    new-instance v3, Lo9/h;\n\n    .line 67\n    const/4 v5, 0x0\n\n    invoke-direct {v3, v5, v5}, Lo9/h;-><init>(Ljava/lang/String;Ljava/lang/Long;)V\n\n    .line 70\n    .line 71\n    .line 74\n    .line 75\n    :goto_0"
    count: 1
  - name: ModuleStatus -> active
    file: smali/net/wowsoftware/hidemyemulator/core/ModuleStatus.smali
    find: (\.method public final isModuleActive\(\)Z\n    \.locals 1\n\n    \.line 1\n)    const/4 v0, 0x0
    replace: $1    const/4 v0, 0x1
    count: 1
build:
  tool: apktool
  sign: ephemeral
